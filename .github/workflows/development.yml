name: development

on:
  push:
    branches:
      - master
      - ci
    tags:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  clang-format-check:
    # The tree has never been uniformly formatted: no clang-format release
    # reproduces it exactly (18.1.8 leaves 2 of 5 sampled files changed, 19/20/21
    # the same, and the earlier "brew install clang-format" job pointed at a
    # moving target).  Reformatting 6,000 lines of quadextractor.cpp inside an
    # unrelated PR is not a useful gate, and a whole-tree check that has never
    # passed is not a gate at all.
    #
    # So check what a change actually introduces: the C++ files it adds or
    # modifies, with a pinned clang-format.  Pure renames are excluded on
    # purpose (the src/core split moved 29 byte-identical files; their
    # formatting is the pre-existing debt, not this PR's).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned clang-format
        run: pip install "clang-format==18.1.8"
      - name: Check formatting of the files this change touches
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="HEAD~1"
          fi
          files="$(git diff --name-only --diff-filter=AM -M "$base"...HEAD -- src | grep -E '\.(cpp|h)$' || true)"
          if [ -z "$files" ]; then
            echo "no changed C++ files under src/; nothing to format"
            exit 0
          fi
          echo "checking:"
          echo "$files"
          # shellcheck disable=SC2086
          clang-format -style=file --dry-run --Werror $files
