name: release

# Runs on tags (and on demand).  The old pipeline drove qmake against
# autoremesher.pro, which 21ad0f9c deleted together with the Qt GUI, so it could
# never succeed; it also ran on every push to master, where a red run buried the
# two workflows that do check something.  This one builds the two products that
# exist today:
#
#   autoremesher(.exe)      headless CLI (CMake, static)
#   autoremesher-gui(.exe)  Go GUI over the CLI (stdlib only, no cgo)
#
# TBB comes from the vendored 2017 tree under thirdparty/tbb, built per platform,
# so the artifacts do not depend on a prebuilt library that is not in the repo.

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefact: windows
          - os: ubuntu-latest
            artefact: linux
          - os: macos-latest
            artefact: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: gui/go.mod

      - name: Build the vendored TBB (windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build_tbb.bat

      - name: Build the vendored TBB (unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S thirdparty/tbb -B build/tbb \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DTBB_BUILD_SHARED=OFF \
            -DTBB_BUILD_TBBMALLOC=OFF \
            -DTBB_BUILD_TBBMALLOC_PROXY=OFF \
            -DTBB_BUILD_TESTS=OFF
          cmake --build build/tbb --parallel
          find build/tbb -maxdepth 2 -name 'libtbb*' | head

      - name: Configure the CLI (windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build/cli -DCMAKE_BUILD_TYPE=Release

      - name: Configure the CLI (unix, vendored static TBB)
        if: runner.os != 'Windows'
        run: |
          lib="$(find build/tbb -maxdepth 2 -name 'libtbb*.a' | head -1)"
          echo "vendored TBB: ${lib:-none}"
          cmake -S . -B build/cli -DCMAKE_BUILD_TYPE=Release \
            ${lib:+-DAR_TBB_STATIC_LIB="$(pwd)/$lib"}

      - name: Build the CLI
        run: cmake --build build/cli --config Release --parallel

      - name: Smoke test the CLI
        shell: bash
        run: |
          exe=build/cli/dist/autoremesher.exe
          [ -f "$exe" ] || exe=build/cli/dist/autoremesher
          "$exe" --version

      - name: Build the GUI
        working-directory: gui
        shell: bash
        run: |
          out=../dist/autoremesher-gui
          [ "$RUNNER_OS" = "Windows" ] && out="$out.exe"
          mkdir -p ../dist
          go build -trimpath -ldflags '-s -w' -o "$out" ./cmd/autoremesher-gui

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p out
          cp build/cli/dist/autoremesher.exe out/
          cp dist/autoremesher-gui.exe out/
          cd out && 7z a "../autoremesher-${{ github.ref_name }}-windows.zip" . > /dev/null
          ls -l ../autoremesher-*-windows.zip

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTEFACT: ${{ matrix.artefact }}
        run: |
          mkdir -p out
          cp build/cli/dist/autoremesher out/
          cp dist/autoremesher-gui out/
          tar -czf "autoremesher-${{ github.ref_name }}-$ARTEFACT.tar.gz" -C out .
          ls -l autoremesher-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: autoremesher-${{ matrix.artefact }}
          path: |
            autoremesher-*.zip
            autoremesher-*.tar.gz
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Built from ${{ github.sha }} by .github/workflows/release.yml" \
            --verify-tag
