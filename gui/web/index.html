<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoRemesher — quad retopology</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span><span class="name">AutoRemesher</span><span class="sub">quad retopology</span></div>
  <div class="chips">
    <span class="chip" id="cli-chip"><i class="dot" id="cli-dot"></i><span id="cli-text">locating CLI…</span></span>
    <span class="chip muted" id="ver-chip">v—</span>
  </div>
</header>

<main class="workspace">
  <aside class="side">
    <section class="card">
      <h2>Model</h2>
      <div id="drop" class="drop" tabindex="0" role="button" aria-label="Choose an OBJ file">
        <input id="file" type="file" accept=".obj,model/obj" hidden />
        <div class="drop-glyph">OBJ</div>
        <div class="drop-title">Drop an .obj here</div>
        <div class="drop-sub">or click to browse</div>
        <div class="drop-info" id="drop-info">no file selected</div>
      </div>
    </section>

    <section class="card">
      <h2>Remesh</h2>
      <div class="row" data-param="targetQuads" data-type="log" data-min="100" data-max="2000000" data-step="1" data-default="20000">
        <label>Target quads</label>
        <input class="rng" type="range" />
        <input class="num" type="number" min="100" max="2000000" step="100" />
      </div>
      <div class="row" data-param="adaptivity" data-type="range" data-min="0" data-max="1" data-step="0.01" data-default="0.5">
        <label>Adaptivity</label>
        <input class="rng" type="range" />
        <input class="num" type="number" min="0" max="1" step="0.01" />
      </div>
      <div class="row" data-param="anisotropy" data-type="range" data-min="0" data-max="1" data-step="0.01" data-default="0">
        <label>Anisotropy</label>
        <input class="rng" type="range" />
        <input class="num" type="number" min="0" max="1" step="0.01" />
      </div>
      <div class="row" data-param="sharpEdge" data-type="range" data-min="0" data-max="180" data-step="1" data-default="60">
        <label>Sharp edge °</label>
        <input class="rng" type="range" />
        <input class="num" type="number" min="0" max="180" step="1" />
      </div>
      <div class="row" data-param="smoothNormal" data-type="range" data-min="0" data-max="180" data-step="1" data-default="0">
        <label>Smooth normal °</label>
        <input class="rng" type="range" />
        <input class="num" type="number" min="0" max="180" step="1" />
      </div>
      <div class="row" data-param="modelType" data-type="select" data-default="organic">
        <label>Model type</label>
        <select class="sel">
          <option value="organic">organic</option>
          <option value="hard-surface">hard-surface</option>
        </select>
      </div>
    </section>

    <details class="card adv" id="advanced">
      <summary>Advanced</summary>
      <div class="adv-body">
        <div class="row" data-param="threads" data-type="int" data-min="0" data-max="256" data-default="0">
          <label>Threads <span class="unit">0 = all</span></label>
          <input class="num wide" type="number" min="0" max="256" step="1" />
        </div>
        <div class="row" data-param="keepIslandFraction" data-type="range" data-min="0" data-max="1" data-step="0.01" data-default="0">
          <label>Keep island ≥</label>
          <input class="rng" type="range" />
          <input class="num" type="number" min="0" max="1" step="0.01" />
        </div>
        <div class="row" data-param="edgeScaling" data-type="range" data-min="0.01" data-max="100" data-step="0.01" data-default="1">
          <label>Edge scaling</label>
          <input class="rng" type="range" />
          <input class="num" type="number" min="0.01" max="100" step="0.01" />
        </div>
        <div class="row check" data-param="exactTargetQuads" data-type="bool" data-default="false">
          <input type="checkbox" id="p-exact" />
          <label for="p-exact">Exact target quads</label>
        </div>
        <div class="row check" data-param="weldPatches" data-type="bool" data-default="false">
          <input type="checkbox" id="p-weld" />
          <label for="p-weld">Weld patches</label>
        </div>
        <div class="row check" data-param="legacyHoles" data-type="bool" data-default="false">
          <input type="checkbox" id="p-legacy" />
          <label for="p-legacy">Legacy hole filling</label>
        </div>
        <div class="row check" data-param="projectedCaps" data-type="bool" data-default="false">
          <input type="checkbox" id="p-caps" />
          <label for="p-caps">Projected caps</label>
        </div>
        <div class="row check" data-param="localRemesh" data-type="bool" data-default="false">
          <input type="checkbox" id="p-local" />
          <label for="p-local">Local remesh pass</label>
        </div>
      </div>
    </details>

    <section class="card actions">
      <div class="btnrow">
        <button id="run" class="btn primary" disabled>Run remesh</button>
        <button id="cancel" class="btn ghost" disabled>Cancel</button>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="meta"><span id="status">idle</span><span id="pct">0%</span><span id="elapsed">0.0s</span></div>
    </section>
  </aside>

  <section class="viewport">
    <div class="vp-bar">
      <div class="seg" id="mode">
        <button type="button" data-mode="shaded" class="on">Shaded</button>
        <button type="button" data-mode="both">+ Wire</button>
        <button type="button" data-mode="wire">Wire</button>
      </div>
      <div class="vp-spacer"></div>
      <span class="hint">drag orbit · wheel zoom · dbl-click reset</span>
      <button id="download" class="btn small" disabled>Save result</button>
    </div>
    <div class="canvas-wrap">
      <canvas id="gl"></canvas>
      <div class="overlay" id="overlay">No model yet — run a remesh to preview the result here.</div>
      <div class="stats" id="stats" hidden></div>
    </div>
  </section>
</main>

<section class="logpane" id="logpane">
  <header class="logbar">
    <button id="logtoggle" class="btn tiny" aria-expanded="true">Log</button>
    <span class="logcount" id="logcount"></span>
    <div class="vp-spacer"></div>
    <button id="logclear" class="btn tiny">Clear</button>
  </header>
  <div class="log" id="log" role="log" aria-live="polite"></div>
</section>

<script src="viewer.js"></script>
<script src="app.js"></script>
</body>
</html>
