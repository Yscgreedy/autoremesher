<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoRemesher · ui-go</title>
<style>
  :root { --bg:#1b1b1e; --panel:#242424; --line:#2f2f33; --fg:#e8e8e8; --dim:#9a9a9a; --accent:#aaebc4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 "Segoe UI",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header h1 span { color:var(--accent); font-weight:400; }
  .health { margin-left:auto; font-size:12px; color:var(--dim); }
  .health.ok { color:var(--accent); } .health.bad { color:#fc6621; }
  .wrap { display:grid; grid-template-columns:340px minmax(320px,1fr) minmax(420px,1.2fr); gap:12px; padding:12px; align-items:start; }
  @media (max-width:1200px) { .wrap { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:10px 12px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 8px; }
  label { display:block; font-size:12px; color:var(--dim); margin-bottom:6px; }
  input, select, button { font:inherit; color:var(--fg); background:#1a1a1d; border:1px solid #3a3a40; border-radius:3px; padding:3px 6px; }
  input { width:100%; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
  .row { display:flex; gap:6px; margin-bottom:6px; }
  .row input { flex:1; }
  select#objs { width:100%; height:72px; margin-bottom:8px; }
  button { cursor:pointer; background:#2f2f35; }
  button:hover { border-color:var(--accent); }
  button.primary { width:100%; padding:6px; background:var(--accent); color:#191919; border-color:var(--accent); font-weight:600; }
  .msg { color:#fc6621; font-size:12px; min-height:16px; margin:6px 0 0; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:3px 4px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; }
  tbody tr { cursor:pointer; } tbody tr:hover { background:#2c2c31; } tbody tr.sel { background:#333a35; }
  .mono { font-family:Consolas,monospace; font-size:11px; color:var(--dim); }
  .statusline { display:flex; align-items:center; gap:8px; font-size:12px; }
  progress { flex:1; height:8px; appearance:none; border:none; background:#333; border-radius:4px; overflow:hidden; }
  progress::-webkit-progress-bar { background:#333; }
  progress::-webkit-progress-value { background:var(--accent); }
  progress::-moz-progress-bar { background:var(--accent); }
  .stats { font-size:12px; color:var(--accent); margin:6px 0; min-height:18px; }
  canvas { width:100%; height:340px; background:#141416; border:1px solid var(--line); border-radius:3px; display:block; cursor:grab; }
  .hint { font-size:11px; color:var(--dim); margin:4px 0 8px; }
  pre#log { margin:0; height:180px; overflow:auto; background:#141416; border:1px solid var(--line); border-radius:3px;
            padding:6px; font:11px/1.45 Consolas,monospace; color:#cfcfcf; white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>AutoRemesher <span>ui-go</span></h1>
  <div id="health" class="health">检测中…</div>
</header>

<div class="wrap">
  <aside class="panel">
    <h2>作业参数</h2>
    <label>输入 OBJ<input id="input" placeholder="C:\models\a.obj"></label>
    <label>输出 OBJ<input id="output" placeholder="留空 = &lt;输入名&gt;-remesh.obj"></label>
    <label>浏览目录（仅 .obj）</label>
    <div class="row"><input id="dir" value="."><button id="browse">列目录</button></div>
    <select id="objs" size="4"></select>
    <div class="grid">
      <label>Target Quads<input id="target_quads" type="number" value="50000" min="1" max="2000000"></label>
      <label>Edge Scaling<input id="edge_scaling" type="number" step="0.1" value="1.0" min="1" max="4"></label>
      <label>Sharp Edge<input id="sharp_edge" type="number" step="1" value="90" min="30" max="180"></label>
      <label>Smooth Normal<input id="smooth_normal" type="number" step="1" value="0" min="0" max="180"></label>
      <label>Adaptivity<input id="adaptivity" type="number" step="0.1" value="1.0" min="0" max="1"></label>
      <label>Anisotropy<input id="anisotropy" type="number" step="0.1" value="1.0" min="0" max="1"></label>
    </div>
    <label>extra_args<input id="extra_args" placeholder="--keep-all-islands --triangulate"></label>
    <button id="run" class="primary">开始重网格</button>
    <p id="form-msg" class="msg"></p>
  </aside>

  <section class="panel">
    <h2>作业</h2>
    <table id="jobs">
      <thead><tr><th>ID</th><th>状态</th><th>quad/non</th><th>顶点</th><th>耗时</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>进度 / 结果</h2>
    <div class="statusline">
      <progress id="bar" max="100" value="0"></progress>
      <span id="pct">0%</span>
      <span id="step"></span>
    </div>
    <div id="stats" class="stats">选择或提交一个作业</div>
    <canvas id="cv" width="720" height="340"></canvas>
    <div id="canvas-hint" class="hint">左键拖动旋转 · 滚轮缩放</div>
    <pre id="log"></pre>
  </section>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const fmt = n => (n == null) ? '0' : Number(n).toLocaleString('en-US');
const S = { id: null, es: null, mesh: null, rot: [-0.55, 0.7], zoom: 1, drag: false, last: [0, 0] }; // UI state
async function api(path, opt) {
  const res = await fetch(path, opt), text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = { error: text.slice(0, 300) }; }
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}
function log(line) {
  const el = $('#log');
  el.textContent += line + '\n';
  if (el.textContent.length > 150000) el.textContent = el.textContent.slice(-90000);
  el.scrollTop = el.scrollHeight;
}
function progress(p, s) {
  if (p !== undefined) { $('#bar').value = p; $('#pct').textContent = p + '%'; }
  if (s !== undefined) $('#step').textContent = s || ''; // 阶段名
}
async function health() {
  try {
    const h = await api('/api/health'), el = $('#health');
    el.textContent = (h.cli_found ? 'CLI ✓ ' : 'CLI ✗ ') + (h.events_json ? 'NDJSON' : '文本(降级)') + ' · v' + h.version;
    el.className = 'health ' + (h.ok ? 'ok' : 'bad');
    el.title = h.degrade_note || h.probe_note || h.cli_path;
  } catch { $('#health').textContent = '健康检查失败'; }
}
async function jobs() {
  try {
    const d = await api('/api/jobs'), body = $('#jobs tbody');
    body.textContent = '';
    for (const j of d.jobs) {
      const tr = document.createElement('tr');
      if (j.id === S.id) tr.className = 'sel';
      tr.innerHTML = '<td class="mono">' + j.id + (j.degraded ? ' ↓' : '') + '</td><td>' + j.status + '</td><td>' +
        fmt(j.quads) + '/' + fmt(j.non_quads) + '</td><td>' + fmt(j.vertices) + '</td><td>' + (j.elapsed_ms / 1000).toFixed(1) + 's</td>';
      tr.onclick = () => select(j.id);
      body.appendChild(tr);
    }
  } catch {} // 服务重启期间静默
}
function select(id) {
  if (S.es) S.es.close();
  S.id = id; $('#log').textContent = ''; progress(0, '');
  $('#stats').textContent = '作业 ' + id;
  S.es = new EventSource('/api/jobs/' + id + '/events');
  S.es.onmessage = ev => { let e; try { e = JSON.parse(ev.data); } catch { return; } onEvent(e); };
  jobs();
}
function onEvent(e) {
  if (e.type === 'progress') progress(e.percent, e.status);
  else if (e.type === 'state') { if (e.status) $('#step').textContent = e.status; }
  else if (e.type === 'log') log('[' + e.time + '] ' + e.line); // 时间戳 + 原文
  else if (e.type === 'phase') { log('[' + e.time + '] phase'); e.lines.forEach(l => log('    ' + l)); }
  else if (e.type === 'done') {
    progress(e.status === 'done' ? 100 : undefined, e.status);
    $('#stats').textContent = 'quads ' + fmt(e.quads) + ' · non-quads ' + fmt(e.non_quads) + ' · vertices ' + fmt(e.vertices) + ' · exit ' + e.exit + ' · ' + (e.elapsed_ms / 1000).toFixed(2) + 's' + (e.error ? ' · ' + e.error : '');
    if (e.status === 'done') preview();
    if (S.es) { S.es.close(); S.es = null; }
    jobs(); // 刷新列表，拿到服务端最终统计
  }
}
async function submit() {
  const extra = $('#extra_args').value.trim(), num = id => Number($(id).value);
  const body = { input: $('#input').value.trim(), output: $('#output').value.trim(),
    target_quads: num('#target_quads'), edge_scaling: num('#edge_scaling'), sharp_edge: num('#sharp_edge'),
    smooth_normal: num('#smooth_normal'), adaptivity: num('#adaptivity'), anisotropy: num('#anisotropy'),
    extra_args: extra ? extra.split(/\s+/) : [] };
  try {
    const d = await api('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    $('#form-msg').textContent = '已提交 ' + d.id; select(d.id);
  } catch (e) { $('#form-msg').textContent = '提交失败: ' + e.message; }
}
async function browse(dir) {
  try {
    const d = await api('/api/fs?dir=' + encodeURIComponent(dir || $('#dir').value.trim() || '.'));
    $('#dir').value = d.dir;
    const sel = $('#objs'); sel.textContent = '';
    for (const f of d.entries) { const o = document.createElement('option'); o.value = f.path; o.textContent = f.name + ' (' + Math.round(f.size / 1024) + ' KB)'; sel.appendChild(o); }
    if (!d.entries.length) { const o = document.createElement('option'); o.textContent = '（没有 .obj）'; o.disabled = true; sel.appendChild(o); }
  } catch (e) { $('#form-msg').textContent = '列目录失败: ' + e.message; }
}
function parseObj(text) {
  const verts = [], faces = [];
  for (const line of text.split('\n')) {
    if (line[0] === 'v' && line[1] === ' ') { const p = line.split(/\s+/); verts.push([+p[1], +p[2], +p[3]]); }
    else if (line[0] === 'f' && line[1] === ' ') faces.push(line.split(/\s+/).slice(1).map(t => parseInt(t, 10) - 1));
  }
  return { verts, faces };
}
function frame(m) {
  const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
  for (const v of m.verts) for (let i = 0; i < 3; i++) { if (v[i] < lo[i]) lo[i] = v[i]; if (v[i] > hi[i]) hi[i] = v[i]; }
  m.center = [0, 1, 2].map(i => (lo[i] + hi[i]) / 2);
  m.radius = Math.max(1e-6, Math.max(hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]) / 2);
}
function draw() {
  const cv = $('#cv'), ctx = cv.getContext('2d'), w = cv.width, h = cv.height;
  ctx.fillStyle = '#141416'; ctx.fillRect(0, 0, w, h);
  const m = S.mesh;
  if (!m || !m.verts.length) return;
  const [rx, ry] = S.rot, cx = Math.cos(rx), sx = Math.sin(rx), cy = Math.cos(ry), sy = Math.sin(ry);
  const k = Math.min(w, h) * 0.42 * S.zoom / m.radius;
  const pts = m.verts.map(v => { // 绕 Y、再绕 X 的手写旋转 + 正交投影
    const x = v[0] - m.center[0], y = v[1] - m.center[1], z = v[2] - m.center[2];
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
    const y1 = y * cx - z1 * sx, z2 = y * sx + z1 * cx;
    return [w / 2 + x1 * k, h / 2 - y1 * k, z2];
  });
  ctx.strokeStyle = '#aaebc4'; ctx.globalAlpha = 0.8; ctx.lineWidth = 1; ctx.beginPath();
  let drawn = 0;
  for (const f of m.faces) {
    for (let i = 0; i < f.length; i++) {
      const a = pts[f[i]], b = pts[f[(i + 1) % f.length]];
      if (a && b) { ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
      if (++drawn >= 60000) break;
    }
    if (drawn >= 60000) break;
  }
  ctx.stroke(); ctx.globalAlpha = 1;
}
async function preview() {
  if (!S.id) return;
  try {
    const res = await fetch('/api/jobs/' + S.id + '/obj');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const m = parseObj(await res.text());
    frame(m); S.mesh = m; S.zoom = 1; draw();
    $('#canvas-hint').textContent = '线框 ' + fmt(m.verts.length) + ' 顶点 / ' + fmt(m.faces.length) + ' 面 · 左键拖动旋转 · 滚轮缩放';
  } catch (e) { log('预览失败: ' + e.message); }
}
const cv = $('#cv');
cv.addEventListener('mousedown', e => { S.drag = true; S.last = [e.clientX, e.clientY]; cv.style.cursor = 'grabbing'; });
window.addEventListener('mouseup', () => { S.drag = false; cv.style.cursor = 'grab'; });
window.addEventListener('mousemove', e => {
  if (!S.drag) return;
  S.rot[1] += (e.clientX - S.last[0]) * 0.01; S.rot[0] += (e.clientY - S.last[1]) * 0.01;
  S.last = [e.clientX, e.clientY]; draw();
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  S.zoom = Math.min(12, Math.max(0.25, S.zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
  draw();
}, { passive: false });
$('#run').onclick = submit;
$('#browse').onclick = () => browse();
$('#objs').onclick = e => { if (e.target.value) $('#input').value = e.target.value; };
$('#dir').addEventListener('keydown', e => { if (e.key === 'Enter') browse(); });
health(); jobs(); browse('.'); setInterval(jobs, 2000); setInterval(health, 15000);
</script>
</body>
</html>
